<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>SciZhi · 手机控制</title>
  <link rel="icon" href="/brand.svg" type="image/svg+xml">
  <style>
    :root{--paper:#f5f8fa;--surface:#fff;--ink:#202d38;--muted:#607482;--line:#dce5ea;--teal:#13776f;--teal-soft:#e4f3f0;--red:#ab4141;--radius:14px}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:wait;opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #75bfb6;outline-offset:3px}[hidden]{display:none!important}h1,h2,h3,p{margin:0}h1{font-size:22px;letter-spacing:-.5px}h2{font-size:18px}h3{font-size:16px}small,.muted{color:var(--muted)}button{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:9px 14px;min-height:44px}.primary{background:var(--teal);border-color:var(--teal);color:#fff}.danger{color:var(--red)}.quiet{background:transparent}.shell{max-width:1060px;margin:auto;padding:20px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 23px}.brand{font-size:12px;font-weight:700;letter-spacing:1.8px;color:var(--teal)}.top-actions,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.login{max-width:440px;margin:8vh auto;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px}.login h2{font-size:25px;margin:12px 0 8px}.login p{margin-bottom:24px;color:var(--muted)}label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;color:var(--ink);min-height:44px}textarea{resize:vertical;min-height:76px}input[type=checkbox]{width:18px;min-height:18px;height:18px;accent-color:var(--teal)}.check{display:flex;gap:9px;align-items:center;font-weight:400}.login .primary{width:100%;margin-top:19px}.notice{min-height:27px;color:var(--muted);font-size:13px;margin-bottom:10px}.notice.error{color:var(--red)}.connection{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}.tabs{display:flex;border-bottom:1px solid var(--line);gap:20px;margin-bottom:24px}.tab{border:0;border-radius:0;background:none;padding:12px 3px;color:var(--muted);border-bottom:2px solid transparent}.tab[aria-selected=true]{border-bottom-color:var(--teal);color:var(--teal);font-weight:700}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;margin-bottom:12px}.task-row{width:100%;text-align:left;display:block;margin-bottom:10px;padding:15px 16px;border-radius:12px}.task-row.selected{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}.row-head{display:flex;align-items:start;justify-content:space-between;gap:10px}.row-title{font-weight:600;overflow-wrap:anywhere}.badge{display:inline-block;white-space:nowrap;background:var(--teal-soft);color:var(--teal);font-size:11px;padding:2px 8px;border-radius:5px}.badge.failed{color:var(--red);background:#fcecec}.meta{font-size:12px;color:var(--muted);margin-top:7px}.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.detail-title{margin-bottom:13px;overflow-wrap:anywhere}.detail-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.timeline{list-style:none;padding:0;margin:20px 0 0;max-height:420px;overflow:auto}.timeline li{font-size:13px;padding:9px 0 9px 14px;border-left:2px solid var(--line);overflow-wrap:anywhere}.timeline time{display:block;font:11px/1.5 Consolas,monospace;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-panel{margin:0 0 22px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.loop-meta{display:flex;gap:20px;margin:14px 0;font-size:13px;color:var(--muted)}.loop-meta strong{display:block;color:var(--ink);font:20px/1.4 Consolas,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);font:12px/1.6 Consolas,monospace;border-radius:8px;padding:12px;max-height:250px;overflow:auto}.approval{border-left:3px solid var(--teal);padding-left:13px;margin:18px 0}.approval h3{margin-bottom:6px}.session-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.footer{font-size:11px;color:var(--muted);margin-top:25px}.footer code{font-family:Consolas,monospace}progress{width:100%;height:6px;border:none;border-radius:4px;overflow:hidden;appearance:none;margin-top:12px}progress::-webkit-progress-bar{background:#e7eef2}progress::-webkit-progress-value{background:var(--teal)}progress::-moz-progress-bar{background:var(--teal)}
    @media(max-width:700px){.shell{padding:17px 16px 42px}.layout{grid-template-columns:1fr}.top{align-items:flex-start;padding-bottom:15px}h1{font-size:20px}.top-actions{justify-content:flex-end}.connection{display:none}.login{margin:5vh auto;padding:22px}.tabs{gap:25px;margin-bottom:20px}.section-head h2{font-size:17px}.card{padding:16px}.detail{margin-top:4px}.two{gap:10px}.top-actions button{padding:8px 10px}.timeline{max-height:300px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div style="display:flex;align-items:center;gap:12px"><img src="/brand.svg" width="44" height="44" alt="格致标识"><div><div class="brand">SCIZHI / 格致</div><h1>手机控制</h1></div></div><div id="connected-actions" class="top-actions" hidden><span class="connection"><span class="dot"></span><span id="sync-label">已连接</span></span><button id="refresh" class="quiet">刷新</button><button id="disconnect" class="quiet">断开</button></div></header>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <form id="login-form" class="login"><div class="brand">连接桌面工作台</div><h2>研究进度，随手查看。</h2><p>手机与电脑连接同一局域网，在桌面开启手机控制后，输入显示的访问令牌。</p><label for="token">访问令牌</label><input id="token" type="password" autocomplete="off" spellcheck="false" required placeholder="粘贴桌面显示的令牌"><button class="primary" type="submit">连接工作台</button><div class="footer">令牌仅保留在当前标签页会话中。</div></form>
  <div id="workbench" hidden>
    <nav class="tabs" role="tablist" aria-label="工作台视图"><button class="tab" role="tab" id="tab-tasks" aria-controls="panel-tasks" aria-selected="true" data-view="tasks">任务进程</button><button class="tab" role="tab" id="tab-loops" aria-controls="panel-loops" aria-selected="false" data-view="loops">循环任务</button><button class="tab" role="tab" id="tab-sessions" aria-controls="panel-sessions" aria-selected="false" data-view="sessions">会话记录</button></nav>
    <section id="panel-tasks" role="tabpanel" aria-labelledby="tab-tasks"><div class="section-head"><h2>正在进行的研究</h2><button id="new-task" class="primary">启动工作流</button></div>
      <form id="task-form" class="card form-panel" hidden><h3>新研究任务</h3><label for="task-workflow">工作流</label><select id="task-workflow"></select><p id="workflow-description" class="meta"></p><label for="task-topic">研究主题</label><textarea id="task-topic" required maxlength="8000" placeholder="例如：多智能体科研系统的可复现性"></textarea><label class="check"><input id="task-offline" type="checkbox" checked>使用离线演示数据</label><div class="form-actions"><button type="button" id="close-task-form">收起</button><button class="primary" type="submit">开始研究</button></div></form>
      <div class="layout"><div id="task-list"></div><div id="task-detail" class="detail empty"><strong>选择一项任务</strong>查看当前节点、执行记录和控制操作。</div></div>
    </section>
    <section id="panel-loops" role="tabpanel" aria-labelledby="tab-loops" hidden><div class="section-head"><h2>按计划继续研究</h2><button id="new-loop" class="primary">新建循环</button></div>
      <form id="loop-form" class="card form-panel" hidden><h3>有上限的循环任务</h3><label for="loop-workflow">工作流</label><select id="loop-workflow"></select><label for="loop-topic">研究主题</label><textarea id="loop-topic" required maxlength="8000"></textarea><div class="two"><div><label for="loop-interval">间隔（秒）</label><input id="loop-interval" type="number" min="1" max="604800" value="60" required></div><div><label for="loop-max">最多轮次</label><input id="loop-max" type="number" min="1" max="100" value="3" required></div></div><label class="check"><input id="loop-offline" type="checkbox" checked>使用离线演示数据</label><p class="meta">上一轮结束后再安排下一轮；需要人工确认时保留等待状态。</p><div class="form-actions"><button id="close-loop-form" type="button">收起</button><button class="primary" type="submit">启动循环</button></div></form><div id="loop-list"></div>
    </section>
    <section id="panel-sessions" role="tabpanel" aria-labelledby="tab-sessions" hidden><div class="section-head"><h2>可追溯的会话记录</h2></div><div id="session-list"></div><div id="session-detail" hidden></div></section>
    <p class="footer">控制当前电脑上的工作台。任务会在手机断开后继续运行。</p>
  </div>
</main>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const statusNames = {running:"运行中",pending:"等待开始",paused:"已暂停",waiting_task:"等待研究任务",waiting_human:"待人工确认",waiting_approval:"待审批",done:"已完成",completed:"已完成",cancelled:"已取消",cancelling:"正在取消",stopped:"已停止",stopping:"停止中",failed:"失败",error:"失败",blocked:"已阻止",planned:"已规划",idle:"等待下一轮",waiting:"等待下一轮"};
  const state = {token:"",view:"tasks",taskId:"",sessionId:"",tasks:[],workflows:[],timer:0,refreshing:false,connected:false,events:[],cursor:0,artRev:"",generation:0};
  const node = (tag,text,className) => {const element=document.createElement(tag);if(text!==undefined)element.textContent=text;if(className)element.className=className;return element;};
  const status = value => statusNames[value] || value || "未开始";
  const workflowLabel = id => (state.workflows.find(row=>row.id===id)||{}).title||'科研工作流';
  const stageLabel = id => {for(const workflow of state.workflows){const stage=(workflow.stages||[]).find(row=>row.id===id);if(stage)return stage.name;}return ({lit_filter:'文献筛选',human_review:'人工确认',extract:'证据抽取',review_frame:'综述框架',citation:'引用整理'})[id]||'等待执行';};
  const notice = (text,error=false) => {$('notice').textContent=text;$('notice').className='notice'+(error?' error':'');};
  const badge = value => node('span',status(value),'badge'+(['failed','error','blocked'].includes(value)?' failed':''));
  const empty = (parent,title,detail) => {parent.replaceChildren();const el=node('div',undefined,'empty');el.append(node('strong',title),node('span',detail));parent.append(el);};
  const date = value => {if(!value)return '';const stamp=new Date(typeof value==='number'?value*1000:value);return Number.isNaN(stamp.getTime())?String(value):stamp.toLocaleString('zh-CN',{hour12:false});};
  function action(text,handler,className=''){const button=node('button',text,className);button.type='button';button.addEventListener('click',()=>perform(button,handler));return button;}
  async function perform(button,handler){button.disabled=true;try{await handler();}catch(error){notice(error.message,true);}finally{button.disabled=false;}}
  async function api(request,path='/api/command'){
    const response=await fetch(path,{method:request?'POST':'GET',headers:{'Authorization':'Bearer '+state.token,'Content-Type':'application/json'},body:request?JSON.stringify(request):undefined,cache:'no-store'});
    const result=await response.json();
    if(response.status===401){disconnect(false);throw new Error('访问令牌无效或已过期，请重新连接。');}
    if(!response.ok||!result.ok)throw new Error(result.error||'操作失败，请在桌面查看详情。');
    return result;
  }
  function disconnect(clear=true){clearTimeout(state.timer);state.connected=false;state.generation++;state.token='';state.taskId='';state.sessionId='';state.events=[];state.cursor=0;state.artRev='';if(clear){try{sessionStorage.removeItem('scizhi-phone-token');}catch(_){}}$('workbench').hidden=true;$('connected-actions').hidden=true;$('login-form').hidden=false;$('token').value='';if(clear)notice('已断开。电脑上的任务继续运行。');}
  async function connect(event){if(event)event.preventDefault();const token=$('token').value.trim();if(!token)return;state.token=token;const button=$('login-form').querySelector('button');await perform(button,async()=>{await api(null,'/api/status');state.connected=true;try{sessionStorage.setItem('scizhi-phone-token',token);}catch(_){}$('login-form').hidden=true;$('workbench').hidden=false;$('connected-actions').hidden=false;notice('已连接桌面工作台。');await loadWorkflows();await refresh();});}
  async function loadWorkflows(){const result=await api({cmd:'workflows'});state.workflows=result.workflows||[];for(const id of ['task-workflow','loop-workflow']){$(id).replaceChildren(...state.workflows.map(workflow=>{const option=node('option',workflow.title||workflow.id);option.value=workflow.id;return option;}));}describeWorkflow();}
  function describeWorkflow(){const workflow=state.workflows.find(row=>row.id===$('task-workflow').value);$('workflow-description').textContent=workflow?workflow.description||'':'';}
  function renderTasks(){const list=$('task-list');if(!state.tasks.length){empty(list,'还没有研究任务','可从上方启动一个已注册工作流。');return;}list.replaceChildren();for(const task of state.tasks){const button=action('',async()=>{if(state.taskId!==task.task_id){state.taskId=task.task_id;state.events=[];state.cursor=0;state.artRev='';}renderTasks();await loadTask();},'task-row'+(state.taskId===task.task_id?' selected':''));const head=node('div',undefined,'row-head');head.append(node('span',task.topic||task.task_id,'row-title'),badge(task.status));button.append(head,node('div',stageLabel(task.pointer)+' · '+(task.offline?'离线演示':'在线研究'),'meta'));if(task.total_nodes){const bar=document.createElement('progress');bar.max=task.total_nodes;bar.value=task.done_nodes||0;bar.setAttribute('aria-label','工作流进度');button.append(bar);}list.append(button);}}
  async function loadTask(){const taskId=state.taskId;if(!taskId)return;const result=await api({cmd:'poll',task_id:taskId,since:state.cursor,art_rev:state.artRev});if(taskId!==state.taskId||!state.connected)return;state.events.push(...(result.events||[]));state.events=state.events.slice(-80);state.cursor=result.total_events||state.cursor;state.artRev=result.art_rev||state.artRev;const panel=$('task-detail');panel.className='detail card';panel.replaceChildren();const task=state.tasks.find(row=>row.task_id===taskId)||{};panel.append(node('h3',task.topic||taskId,'detail-title'));const meta=node('div',undefined,'detail-top');meta.append(badge(result.status),node('span',stageLabel(result.pointer),'muted'));panel.append(meta);const actions=node('div',undefined,'actions');if(['running','pending'].includes(result.status))actions.append(action('暂停',()=>controlTask('pause')));if(['paused','waiting_human'].includes(result.status))actions.append(action(result.status==='waiting_human'?'确认并继续':'继续',()=>controlTask('resume'),'primary'));if(!['done','completed','cancelled','error','failed'].includes(result.status))actions.append(action('取消任务',()=>controlTask('cancel'),'danger'));panel.append(actions);const timeline=node('ol',undefined,'timeline');for(const event of state.events){const entry=node('li');const payload=event.payload||event;entry.append(node('time',date(event.timestamp||event.time||event.ts)),node('span',payload.message||payload.text||event.message||event.type||'状态已更新'));timeline.append(entry);}if(!state.events.length)timeline.append(node('li','执行记录将在任务推进时显示。'));panel.append(timeline);}
  async function controlTask(cmd){await api({cmd,task_id:state.taskId});notice(cmd==='pause'?'已请求暂停；等待任务到达可暂停位置。':cmd==='cancel'?'已请求取消；以下显示引擎返回的状态。':'已请求继续任务。');await refresh();}
  async function renderLoops(){const result=await api({cmd:'loop_list'});const list=$('loop-list');list.replaceChildren();if(!(result.loops||[]).length){empty(list,'还没有循环任务','设定研究主题、间隔和轮次上限后启动。');return;}for(const loop of result.loops){const card=node('article',undefined,'card');const head=node('div',undefined,'row-head');head.append(node('h3',loop.topic||loop.loop_id),badge(loop.status));card.append(head,node('div',workflowLabel(loop.workflow_id),'meta'));const facts=node('div',undefined,'loop-meta');const count=node('span','已执行 / 上限');count.prepend(node('strong',(loop.iteration||0)+' / '+loop.max_iterations));const interval=node('span','间隔秒数');interval.prepend(node('strong',String(loop.interval_seconds)));facts.append(count,interval);card.append(facts);if(loop.last_error)card.append(node('p',loop.last_error,'danger'));const actions=node('div',undefined,'actions');if(['stopped','paused','error','failed'].includes(loop.status))actions.append(action('继续循环',async()=>{await api({cmd:'loop_resume',loop_id:loop.loop_id});await renderLoops();},'primary'));else if(!['completed','done'].includes(loop.status))actions.append(action('停止循环',async()=>{await api({cmd:'loop_stop',loop_id:loop.loop_id});await renderLoops();}));if(loop.task_id)actions.append(action('查看当前任务',async()=>{state.taskId=loop.task_id;state.events=[];state.cursor=0;state.artRev='';await switchView('tasks');}));card.append(actions);list.append(card);}}
  async function renderSessions(){const result=await api({cmd:'sessions'});const list=$('session-list');list.replaceChildren();if(!(result.sessions||[]).length){empty(list,'还没有智能体会话','在桌面或终端启动智能体后，可在这里查看和导出记录。');return;}for(const session of result.sessions){const card=node('article',undefined,'card');const head=node('div',undefined,'row-head');head.append(node('h3',session.summary||session.title||session.session_id),badge(session.status));card.append(head,node('div',(session.agent||'research')+' · '+date(session.updated_at),'meta'));const actions=node('div',undefined,'session-actions');actions.append(action('查看详情',async()=>{state.sessionId=session.session_id;await loadSession();}),action('导出 Markdown',()=>exportSession(session.session_id,'markdown')),action('导出 JSON',()=>exportSession(session.session_id,'json')));card.append(actions);list.append(card);}if(state.sessionId)await loadSession();}
  async function loadSession(){
    const sid=state.sessionId;
    const result=await api({cmd:'session_snapshot',session_id:sid});
    if(state.sessionId!==sid)return;
    const snapshot=result.snapshot||{},detail=$('session-detail');
    detail.hidden=false;detail.className='card';
    detail.replaceChildren(node('h3',snapshot.request||'会话详情'),node('p',status(snapshot.status),'meta'));
    const controls=node('div',undefined,'session-actions');
    const control=async cmd=>{await api({cmd,session_id:sid});notice(cmd==='agent_cancel'?'停止请求已送达。':'会话已继续。');if(state.sessionId===sid)await renderSessions();};
    if(snapshot.driver==='adaptive'&&['waiting_task','paused'].includes(snapshot.status))controls.append(action('继续会话',()=>control('agent_continue'),'primary'));
    if(['running','waiting_task','waiting_approval','paused','cancelling'].includes(snapshot.status))controls.append(action('停止会话',()=>control('agent_cancel'),'danger'));
    if(snapshot.task_id)controls.append(action('查看关联研究',async()=>{state.taskId=snapshot.task_id;state.events=[];state.cursor=0;state.artRev='';await switchView('tasks');}));
    detail.append(controls);
    const pending=snapshot.pending;
    if(pending){const block=node('div',undefined,'approval');block.append(node('h3','等待你的确认'),node('p',pending.tool||'工具调用'),node('pre',JSON.stringify(pending.arguments||{},null,2)));const actions=node('div',undefined,'actions');const respond=async cmd=>{await api({cmd,session_id:sid,tool_call_id:pending.id||pending.tool_call_id});notice(cmd==='agent_approve'?'已提交本次批准。':'已拒绝本次操作。');if(state.sessionId===sid)await loadSession();};actions.append(action('批准本次',()=>respond('agent_approve'),'primary'),action('拒绝',()=>respond('agent_deny'),'danger'));block.append(actions);detail.append(block);}
    if(snapshot.content)detail.append(node('pre',snapshot.content));
    if(snapshot.plan){const steps=snapshot.plan.steps||[];const list=node('ol');for(const step of steps)list.append(node('li',step.description||step.reason||step.tool||''));detail.append(list);}
  }
  async function exportSession(sessionId,format){const result=await api({cmd:'session_export',session_id:sessionId,format});const url=URL.createObjectURL(new Blob([result.content],{type:result.mime+';charset=utf-8'}));const anchor=node('a');anchor.href=url;anchor.download=result.filename;document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('会话记录已下载。');}
  async function refresh(){if(!state.connected||state.refreshing)return;state.refreshing=true;clearTimeout(state.timer);try{if(state.view==='tasks'){const result=await api(null,'/api/status');state.tasks=result.tasks||[];renderTasks();await loadTask();}else if(state.view==='loops')await renderLoops();else await renderSessions();$('sync-label').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});}catch(error){notice('刷新失败：'+error.message,true);$('sync-label').textContent='连接中断';}finally{state.refreshing=false;if(state.connected)state.timer=setTimeout(refresh,2500);}}
  async function switchView(view){state.view=view;for(const tab of document.querySelectorAll('[data-view]')){const selected=tab.dataset.view===view;tab.setAttribute('aria-selected',String(selected));$('panel-'+tab.dataset.view).hidden=!selected;}await refresh();}
  $('login-form').addEventListener('submit',connect);$('disconnect').addEventListener('click',()=>disconnect());$('refresh').addEventListener('click',refresh);$('new-task').addEventListener('click',()=>{$('task-form').hidden=!$('task-form').hidden;});$('close-task-form').addEventListener('click',()=>{$('task-form').hidden=true;});$('new-loop').addEventListener('click',()=>{$('loop-form').hidden=!$('loop-form').hidden;});$('close-loop-form').addEventListener('click',()=>{$('loop-form').hidden=true;});$('task-workflow').addEventListener('change',describeWorkflow);for(const tab of document.querySelectorAll('[data-view]'))tab.addEventListener('click',()=>switchView(tab.dataset.view));
  $('task-form').addEventListener('submit',event=>{event.preventDefault();perform(event.submitter,async()=>{const result=await api({cmd:'workflow_run',workflow_id:$('task-workflow').value,topic:$('task-topic').value.trim(),offline:$('task-offline').checked});state.taskId=result.task_id;state.events=[];state.cursor=0;state.artRev='';$('task-form').hidden=true;notice('研究任务已启动。');await refresh();});});
  $('loop-form').addEventListener('submit',event=>{event.preventDefault();perform(event.submitter,async()=>{await api({cmd:'loop_start',workflow_id:$('loop-workflow').value,topic:$('loop-topic').value.trim(),offline:$('loop-offline').checked,interval_seconds:Number($('loop-interval').value),max_iterations:Number($('loop-max').value)});$('loop-form').hidden=true;notice('循环任务已启动。');await refresh();});});
  try{const saved=sessionStorage.getItem('scizhi-phone-token');if(saved){$('token').value=saved;connect();}}catch(_){}
})();
</script>
</body>
</html>
